<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Koda — voice</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0e12; color: #e6e9ee;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { text-align: center; max-width: 28rem; padding: 2rem; }
  h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: .02em; }
  #orb {
    width: 84px; height: 84px; border-radius: 50%; margin: 1.2rem auto;
    background: radial-gradient(circle at 35% 30%, #3a4a63, #18202c);
    transition: box-shadow .25s ease, transform .25s ease;
  }
  .live #orb { box-shadow: 0 0 36px 6px rgba(96,165,250,.35); }
  .speaking #orb { box-shadow: 0 0 48px 12px rgba(52,211,153,.45); transform: scale(1.06); }
  button {
    font: inherit; padding: .65rem 1.6rem; border-radius: 999px; border: 0;
    background: #2563eb; color: white; cursor: pointer;
  }
  button:disabled { background: #334155; cursor: default; }
  #status { margin-top: 1rem; color: #93a3b8; font-size: .9rem; min-height: 1.4em; }
  .hint { color: #64748b; font-size: .8rem; margin-top: 2rem; }
</style>
</head>
<body>
<main>
  <h1>Koda</h1>
  <div id="orb"></div>
  <button id="go">Start talking</button>
  <p id="status">Headphones recommended — Koda listens while it speaks.</p>
  <p class="hint">Koda speaks first. Interrupt it any time — that's by design.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script>
const btn = document.getElementById("go");
const status = document.getElementById("status");

btn.onclick = async () => {
  btn.disabled = true;
  status.textContent = "connecting…";
  try {
    const res = await fetch("/token");
    let { token, url } = await res.json();
    // Page opened from another device? Point at the same host serving this page.
    if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1")
      url = url.replace("localhost", location.hostname);

    const room = new LivekitClient.Room({
      // Rule 3 — interruption is sacred: mic stays OPEN, AEC handles echo.
      audioCaptureDefaults: {
        echoCancellation: true, noiseSuppression: true, autoGainControl: true,
      },
    });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "audio") {
        const el = track.attach();          // user gesture already happened → autoplay OK
        document.body.appendChild(el);
      }
    });
    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
      const koda = speakers.some((p) => p.identity === "koda-agent");
      document.body.classList.toggle("speaking", koda);
      status.textContent = koda ? "Koda is speaking — feel free to cut in" : "listening…";
    });
    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      document.body.classList.remove("live", "speaking");
      btn.disabled = false;
      btn.textContent = "Reconnect";
      status.textContent = "disconnected";
    });

    await room.connect(url, token);
    await room.localParticipant.setMicrophoneEnabled(true);
    document.body.classList.add("live");
    btn.textContent = "Connected";
    status.textContent = "listening…";
  } catch (e) {
    btn.disabled = false;
    status.textContent = "failed: " + (e?.message || e);
  }
};
</script>
</body>
</html>
